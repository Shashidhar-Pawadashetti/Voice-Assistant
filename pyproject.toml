[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "krishi-mitra-backend"
version = "0.1.0"
description = "Krishi Mitra — Kannada voice-first farmer scheme assistant backend"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Krishi Mitra Engineering Team"}
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.29",
    "greenlet>=3.0.0",
    "psycopg[binary]>=3.1.18",
    "alembic>=1.13.1",
    "httpx>=0.27.0",
    "tenacity>=8.2.3",
    "python-multipart>=0.0.9",
    "argon2-cffi>=23.1.0",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    "imageio-ffmpeg>=0.5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-cov>=5.0.0",
    "aiosqlite>=0.20.0",
    "jiwer>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["app"]
concurrency = ["greenlet", "thread"]
omit = ["tests/*", "alembic/*"]
