<!DOCTYPE html>
<html lang="kn" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#1b4d3e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="ಕೃಷಿ ಮಿತ್ರ — ಕನ್ನಡ ಧ್ವನಿ-ಮೊದಲ ಕೃಷಿ ಯೋಜನೆ ಸಹಾಯಕ (Krishi Mitra - Kannada Voice-First Farmer Assistant)" />
    
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Google Fonts for Native Kannada Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Tamma+2:wght@400;500;600;700&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
    <title>ಕೃಷಿ ಮಿತ್ರ (Krishi Mitra)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then(
            (reg) => console.log('Krishi Mitra PWA ServiceWorker registered with scope:', reg.scope),
            (err) => console.warn('Krishi Mitra PWA ServiceWorker registration failed:', err)
          );
        });
      }
    </script>
  </body>
</html>
