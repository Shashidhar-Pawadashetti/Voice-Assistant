# HTTP server - redirect all traffic to HTTPS (in production) or handle standard HTTP
server {
    listen 80;
    server_name localhost _;

    # ACME-challenge for Let's Encrypt certificates and quiet handling for browser probes
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /.well-known/ {
        return 404;
        access_log off;
        log_not_found off;
    }

    # For local/testing environment, proxy directly; in production, enforce redirect
    # In production with TLS configured, redirect 301 https://$host$request_uri;
    location /api/ {
        client_max_body_size 2M;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Allow larger payload (15MB) specifically for voice turns
    location /api/v1/conversations/ {
        client_max_body_size 15M;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 10s;
    }

    # Rate-limited auth endpoints
    location /api/v1/auth/ {
        limit_req zone=auth_limit burst=5 nodelay;
        client_max_body_size 1M;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /health/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        proxy_pass http://frontend_pwa;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

