version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: krishi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krishi_app
      POSTGRES_PASSWORD: krishi_mitra_dev_pass
      POSTGRES_DB: krishi_mitra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishi_app -d krishi_mitra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krishi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krishi_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_SECRET_KEY: change-me-in-production-must-be-at-least-32-chars-long
      DATABASE_URL: postgresql+psycopg://krishi_app:krishi_mitra_dev_pass@db:5432/krishi_mitra
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b
      AUDIO_TEMP_DIR: /app/.runtime/audio
      ENABLE_PUBLIC_DOCS: "false"
      MAX_UPLOAD_SIZE_BYTES: "15728640"
      TRUSTED_PROXIES: "127.0.0.1,nginx"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audio_temp:/app/.runtime/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krishi_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: krishi_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
  redisdata:
  audio_temp:
