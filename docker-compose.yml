version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: krishi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: krishi_app
      POSTGRES_PASSWORD: krishi_mitra_dev_pass
      POSTGRES_DB: krishi_mitra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krishi_app -d krishi_mitra"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krishi_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krishi_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      APP_SECRET_KEY: 14c9c001229930c76736890c01e385176e6c7ff6f5297412da8e5b4154ab1371
      JWT_SECRET_KEY: afd8c6647d9488fda8e14c9a2fc49c8d7e9ca97902283b568be93b728293d490
      ENCRYPTION_KEY: 2b7d421167e60b0d65e26c7b3a0ebe083b89969f5d3a611b89d48c83327770d0
      BLIND_INDEX_KEY: 2b06f60860c1ba34620fa345c3a171a3dc9ad64a409a3a5a50e33261a261b6fe
      DATABASE_URL: postgresql+psycopg://krishi_app:krishi_mitra_dev_pass@db:5432/krishi_mitra
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: qwen3:4b
      AUDIO_TEMP_DIR: /app/.runtime/audio
      ENABLE_PUBLIC_DOCS: "false"
      MAX_UPLOAD_SIZE_BYTES: "15728640"
      TRUSTED_PROXIES: "127.0.0.1,nginx,reverse-proxy"
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173,http://localhost,http://127.0.0.1"
      ALLOWED_HOSTS: "*"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audio_temp:/app/.runtime/audio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krishi_frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  reverse-proxy:
    image: nginx:1.27-alpine
    container_name: krishi_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
  redisdata:
  audio_temp:
